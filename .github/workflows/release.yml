name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dryRun:
        description: 'Dry run (no publish)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --run

      - name: Build
        run: pnpm build

      - name: Bump version
        id: version
        run: |
          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then
            echo "Dry run - skipping version bump"
            echo "new_version=$(cat package.json | jq -r .version)" >> $GITHUB_OUTPUT
          else
            npm version ${{ github.event.inputs.version }} --no-git-tag-version
            echo "new_version=$(cat package.json | jq -r .version)" >> $GITHUB_OUTPUT
          fi

      - name: Update CHANGELOG
        if: github.event.inputs.dryRun != 'true'
        run: |
          npx auto-changelog --stdout --template keepachangelog --unreleased --commit-limit 0 > CHANGELOG.md
          git add CHANGELOG.md package.json
          git commit -m "chore: release v${{ steps.version.outputs.new_version }}"

      - name: Create git tag
        if: github.event.inputs.dryRun != 'true'
        run: |
          git tag -a v${{ steps.version.outputs.new_version }} -m "Release v${{ steps.version.outputs.new_version }}"
          git push origin v${{ steps.version.outputs.new_version }}

      - name: Publish to npm
        if: github.event.inputs.dryRun != 'true'
        run: pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: github.event.inputs.dryRun != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          files: |
            dist/main.js
            dist/main.d.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changes
        if: github.event.inputs.dryRun != 'true'
        run: git push origin main --tags